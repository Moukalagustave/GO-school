<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Go-school — Messages</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chat.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="wa-layout" id="wa-layout">

    <nav class="wa-rail">
        <a href="radar.html" class="wa-rail-icon" title="Radar" aria-label="Radar des élèves">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="3"/></svg>
        </a>
        <a href="chat.html" class="wa-rail-icon active" title="Messages" aria-label="Messages">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
        </a>
        <button type="button" class="wa-rail-icon wa-rail-bottom" id="signout-btn" title="Déconnexion" aria-label="Déconnexion">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
    </nav>

    <aside class="wa-list-panel" id="wa-list-panel">
        <header class="wa-list-header">
            <a href="profil.html" title="Mon profil" aria-label="Mon profil">
                <img id="my-avatar" class="wa-avatar-sm" src="" alt="">
            </a>
            <span class="wa-list-title">Messages</span>
            <button type="button" class="header-icon-btn" id="toggle-group-panel" title="Nouveau groupe" aria-label="Nouveau groupe">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            </button>
        </header>

        <div class="wa-search">
            <input type="text" id="conv-search" placeholder="Rechercher une conversation">
        </div>

        <div class="wa-tabs">
            <button type="button" class="wa-tab active" data-filter="all">Toutes</button>
            <button type="button" class="wa-tab" data-filter="group">Groupes</button>
        </div>

        <div id="group-panel" class="wa-group-panel">
            <input type="text" id="group-name" placeholder="Nom du groupe" maxlength="60">
            <div id="group-members-list" class="wa-group-members"></div>
            <button type="button" class="btn-accent-solid" id="create-group-btn">Créer le groupe</button>
        </div>

        <div id="chats-list" class="wa-conv-list"></div>
    </aside>

    <section class="wa-chat-panel" id="wa-chat-panel">
        <div id="wa-empty-state" class="wa-empty-state">
            <svg viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="currentColor" stroke-width="1"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <p>Sélectionne une conversation pour commencer à discuter.</p>
        </div>

        <div id="wa-active-chat" class="wa-active-chat" style="display:none;">
            <header class="chat-header">
                <button type="button" class="chat-header-back" id="mobile-back-btn" aria-label="Retour à la liste">←</button>
                <div class="chat-header-avatar-wrap">
                    <img id="chat-header-avatar" class="chat-header-avatar" src="" alt="">
                    <span id="chat-header-online-dot" class="online-dot" style="display:none;"></span>
                </div>
                <div class="chat-header-info">
                    <div id="chat-header-name" class="chat-header-name">—</div>
                    <span id="connection-status">Déconnecté</span>
                    <span id="typing-indicator" class="typing-indicator" style="display:none;"></span>
                </div>
                <button type="button" class="btn-leave-group" id="leave-group-btn" style="display:none;">Quitter</button>
            </header>

            <div id="chat-messages" class="chat-messages"></div>

            <div id="reply-preview-bar" class="reply-preview-bar">
                <span id="reply-preview-text"></span>
                <button type="button" id="reply-cancel-btn" aria-label="Annuler la réponse">×</button>
            </div>

            <form id="chat-form" class="chat-input-row">
                <button type="button" class="btn-attach" id="attach-btn" aria-label="Envoyer une image">📎</button>
                <input type="file" id="media-input" accept="image/jpeg,image/png,image/webp" hidden>
                <input type="text" id="chat-input" maxlength="2000" placeholder="Écris un message…" autocomplete="off">
                <button type="submit" class="btn-send" aria-label="Envoyer">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
                </button>
            </form>
        </div>
    </section>
</div>

<div id="toast"></div>

<script src="chat.js"></script>
<script>
    const SUPABASE_URL = 'https://afwutxnapjrauouazcui.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_toczTCF8xRgxwebjftoXuA_QAO8MTKp';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUserId = null;
    let manager = null;
    let allConversations = [];
    let profilesMapGlobal = {};
    let readMapGlobal = {};
    let currentReplyTarget = null; // client_message_id du message auquel on répond

    window.setReplyTarget = (clientMessageId, previewText) => {
        currentReplyTarget = clientMessageId;
        document.getElementById('reply-preview-text').textContent = (previewText || '').slice(0, 80);
        document.getElementById('reply-preview-bar').classList.add('open');
        document.getElementById('chat-input').focus();
    };

    // ---------- PRÉSENCE (Supabase Presence — heartbeat/reconnexion gérés en interne) ----------
    let presenceChannel = null;
    const onlineUserIds = new Set();

    let presenceInitialized = false;

    function initPresence() {
        presenceChannel = supabaseClient.channel('presence:online', {
            config: { presence: { key: currentUserId } }
        });
        presenceChannel.on('presence', { event: 'sync' }, () => {
            const state = presenceChannel.presenceState();
            const newIds = new Set(Object.keys(state));
            // Le premier sync ne fait que refléter qui est déjà en ligne au chargement —
            // ce n'est pas une "arrivée", donc pas de son à ce moment-là.
            if (presenceInitialized) {
                newIds.forEach(id => {
                    if (!onlineUserIds.has(id) && id !== currentUserId && profilesMapGlobal[id]) {
                        playSound('friend_online');
                    }
                });
            }
            presenceInitialized = true;
            onlineUserIds.clear();
            newIds.forEach(id => onlineUserIds.add(id));
            updateOnlineDots();
        });
        presenceChannel.subscribe(async (status) => {
            if (status === 'SUBSCRIBED') await presenceChannel.track({ online_at: new Date().toISOString() });
        });
    }

    function updateOnlineDots() {
        document.querySelectorAll('[data-online-for]').forEach(el => {
            el.style.display = onlineUserIds.has(el.dataset.onlineFor) ? 'block' : 'none';
        });
    }

    function isValidAvatarUrlLocal(url) {
        return isValidAvatarUrl(url); // définie dans chat.js (chargé avant ce script)
    }

    (async () => {
        const { data: { session } } = await supabaseClient.auth.getSession();
        if (!session) { window.location.href = 'index.html'; return; }
        currentUserId = session.user.id;

        const { data: myProfile } = await supabaseClient
            .from('profiles').select('avatar_url').eq('id', currentUserId).maybeSingle();
        document.getElementById('my-avatar').src = isValidAvatarUrlLocal(myProfile?.avatar_url)
            ? myProfile.avatar_url
            : `https://api.dicebear.com/9.x/bottts/svg?seed=${encodeURIComponent(currentUserId)}`;

        initPresence();
        await loadConversationList();

        const params = new URLSearchParams(window.location.search);
        const initialId = params.get('c');
        if (initialId) await openConversation(initialId);
    })();

    // ---------- TITRE D'ONGLET DYNAMIQUE ----------
    function updateTabTitle() {
        const totalUnread = allConversations.filter(c =>
            c.lastMessage && c.lastMessage.seq > (readMapGlobal[c.id] || 0)
        ).length;
        document.title = totalUnread > 0 ? `(${totalUnread}) Go-school — Messages` : 'Go-school — Messages';
    }

    // ==========================================
    // LISTE DES CONVERSATIONS
    // ==========================================
    async function loadConversationList() {
        const { data: memberships } = await supabaseClient
            .from('conversation_members').select('conversation_id, last_read_seq').eq('user_id', currentUserId);

        const ids = (memberships || []).map(m => m.conversation_id);
        readMapGlobal = {};
        (memberships || []).forEach(m => { readMapGlobal[m.conversation_id] = m.last_read_seq || 0; });

        if (ids.length === 0) { renderConversationRows([]); updateTabTitle(); return; }

        const { data: conversations } = await supabaseClient
            .from('conversations')
            .select('id, type, name, direct_user_a, direct_user_b, created_at')
            .in('id', ids);

        const otherUserIds = (conversations || [])
            .filter(c => c.type === 'direct')
            .map(c => c.direct_user_a === currentUserId ? c.direct_user_b : c.direct_user_a);

        profilesMapGlobal = {};
        if (otherUserIds.length > 0) {
            const { data: profiles } = await supabaseClient
                .from('profiles').select('id, prenom, avatar_url').in('id', otherUserIds);
            (profiles || []).forEach(p => { profilesMapGlobal[p.id] = p; });
        }

        const { data: messages } = await supabaseClient
            .from('messages').select('conversation_id, content, seq, created_at')
            .in('conversation_id', ids).order('seq', { ascending: false });

        const lastMessageMap = {};
        (messages || []).forEach(m => { if (!lastMessageMap[m.conversation_id]) lastMessageMap[m.conversation_id] = m; });

        allConversations = (conversations || []).map(c => ({ ...c, lastMessage: lastMessageMap[c.id] || null }));
        allConversations.sort((a, b) => (b.lastMessage?.seq || 0) - (a.lastMessage?.seq || 0));

        renderConversationRows(allConversations);
        updateTabTitle();
        loadMembersForGroupPanel();
    }

    function renderConversationRows(conversations, filter = 'all', searchTerm = '') {
        const listEl = document.getElementById('chats-list');
        listEl.innerHTML = '';

        const filtered = conversations.filter(c => {
            if (filter === 'group' && c.type !== 'group') return false;
            const name = c.type === 'group' ? (c.name || 'Groupe')
                : (profilesMapGlobal[c.direct_user_a === currentUserId ? c.direct_user_b : c.direct_user_a]?.prenom || 'Élève');
            return name.toLowerCase().includes(searchTerm.toLowerCase());
        });

        if (filtered.length === 0) {
            const p = document.createElement('p');
            p.className = 'wa-empty-list';
            p.textContent = conversations.length === 0
                ? 'Aucune conversation. Va sur le Radar pour ajouter un ami.'
                : 'Aucun résultat.';
            listEl.appendChild(p);
            return;
        }

        filtered.forEach(conv => {
            const row = document.createElement('div');
            row.className = 'wa-conv-row';
            row.dataset.conversationId = conv.id;

            let displayName, avatarUrl, isGroup = conv.type === 'group', otherId = null;
            if (isGroup) {
                displayName = conv.name || 'Groupe';
            } else {
                otherId = conv.direct_user_a === currentUserId ? conv.direct_user_b : conv.direct_user_a;
                const profile = profilesMapGlobal[otherId];
                displayName = profile?.prenom || 'Élève';
                avatarUrl = isValidAvatarUrlLocal(profile?.avatar_url)
                    ? profile.avatar_url
                    : `https://api.dicebear.com/9.x/bottts/svg?seed=${encodeURIComponent(otherId || conv.id)}`;
            }

            const avatarWrap = document.createElement('div');
            avatarWrap.className = 'wa-conv-avatar-wrap';

            if (isGroup) {
                const avatarDiv = document.createElement('div');
                avatarDiv.className = 'wa-conv-avatar group';
                avatarDiv.textContent = '👥';
                avatarWrap.appendChild(avatarDiv);
            } else {
                const img = document.createElement('img');
                img.className = 'wa-conv-avatar';
                img.src = avatarUrl;
                img.alt = '';
                avatarWrap.appendChild(img);

                const dot = document.createElement('span');
                dot.className = 'online-dot';
                dot.dataset.onlineFor = otherId;
                dot.style.display = onlineUserIds.has(otherId) ? 'block' : 'none';
                avatarWrap.appendChild(dot);
            }
            row.appendChild(avatarWrap);

            const info = document.createElement('div');
            info.className = 'wa-conv-info';
            const nameEl = document.createElement('div');
            nameEl.className = 'wa-conv-name';
            nameEl.textContent = displayName;
            info.appendChild(nameEl);
            const previewEl = document.createElement('div');
            previewEl.className = 'wa-conv-preview';
            previewEl.textContent = conv.lastMessage ? conv.lastMessage.content : 'Aucun message';
            info.appendChild(previewEl);
            row.appendChild(info);

            const rightCol = document.createElement('div');
            rightCol.className = 'wa-conv-right';

            if (conv.lastMessage) {
                const timeEl = document.createElement('span');
                timeEl.className = 'wa-conv-time';
                timeEl.textContent = new Date(conv.lastMessage.created_at)
                    .toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit' });
                rightCol.appendChild(timeEl);
            }

            if (conv.lastMessage && conv.lastMessage.seq > (readMapGlobal[conv.id] || 0)) {
                const badge = document.createElement('span');
                badge.className = 'wa-unread-badge';
                badge.textContent = '●';
                rightCol.appendChild(badge);
            }

            row.appendChild(rightCol);
            row.addEventListener('click', () => openConversation(conv.id));
            listEl.appendChild(row);
        });
    }

    document.getElementById('conv-search').addEventListener('input', (e) => {
        const activeFilter = document.querySelector('.wa-tab.active').dataset.filter;
        renderConversationRows(allConversations, activeFilter, e.target.value);
    });

    document.querySelectorAll('.wa-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.wa-tab').forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            renderConversationRows(allConversations, tab.dataset.filter, document.getElementById('conv-search').value);
        });
    });

    // ==========================================
    // OUVERTURE D'UNE CONVERSATION
    // ==========================================
    async function openConversation(conversationId) {
        if (manager) manager.stop();
        document.getElementById('chat-messages').innerHTML = '';
        document.getElementById('typing-indicator').style.display = 'none';

        history.pushState(null, '', `chat.html?c=${encodeURIComponent(conversationId)}`);
        document.getElementById('wa-empty-state').style.display = 'none';
        document.getElementById('wa-active-chat').style.display = 'flex';
        document.getElementById('wa-layout').classList.add('chat-active');

        document.querySelectorAll('.wa-conv-row').forEach(r =>
            r.classList.toggle('selected', r.dataset.conversationId === conversationId));

        const { data: conv, error } = await supabaseClient
            .from('conversations')
            .select('id, type, name, direct_user_a, direct_user_b')
            .eq('id', conversationId).single();

        if (error || !conv) {
            document.getElementById('chat-header-name').textContent = 'Conversation introuvable';
            return;
        }

        const isGroup = conv.type === 'group';
        const dotEl = document.getElementById('chat-header-online-dot');
        document.getElementById('leave-group-btn').style.display = isGroup ? 'inline-block' : 'none';
        currentReplyTarget = null;
        document.getElementById('reply-preview-bar').classList.remove('open');
        if (isGroup) {
            document.getElementById('chat-header-name').textContent = conv.name || 'Groupe';
            document.getElementById('chat-header-avatar').style.display = 'none';
            dotEl.style.display = 'none';
        } else {
            const otherId = conv.direct_user_a === currentUserId ? conv.direct_user_b : conv.direct_user_a;
            const { data: profile } = await supabaseClient
                .from('profiles').select('prenom, avatar_url').eq('id', otherId).maybeSingle();
            document.getElementById('chat-header-avatar').style.display = '';
            document.getElementById('chat-header-name').textContent = profile?.prenom || 'Élève';
            document.getElementById('chat-header-avatar').src = isValidAvatarUrlLocal(profile?.avatar_url)
                ? profile.avatar_url
                : `https://api.dicebear.com/9.x/bottts/svg?seed=${encodeURIComponent(otherId)}`;
            dotEl.dataset.onlineFor = otherId;
            dotEl.style.display = onlineUserIds.has(otherId) ? 'block' : 'none';
        }

        manager = new ChatManager(conversationId, currentUserId, isGroup);
        await manager.start();

        setTimeout(loadConversationList, 1500);
    }

    document.getElementById('mobile-back-btn').addEventListener('click', () => {
        document.getElementById('wa-layout').classList.remove('chat-active');
        if (manager) { manager.stop(); manager = null; }
        history.pushState(null, '', 'chat.html');
    });

    document.getElementById('reply-cancel-btn').addEventListener('click', () => {
        currentReplyTarget = null;
        document.getElementById('reply-preview-bar').classList.remove('open');
    });

    document.getElementById('chat-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const input = document.getElementById('chat-input');
        if (manager && input.value.trim()) {
            manager.sendMessage(input.value, currentReplyTarget);
            input.value = '';
            currentReplyTarget = null;
            document.getElementById('reply-preview-bar').classList.remove('open');
        }
    });

    document.getElementById('leave-group-btn').addEventListener('click', async () => {
        if (!manager || !confirm('Quitter ce groupe ?')) return;
        const ok = await manager.leaveGroup();
        if (ok) {
            manager = null;
            document.getElementById('wa-layout').classList.remove('chat-active');
            document.getElementById('wa-active-chat').style.display = 'none';
            document.getElementById('wa-empty-state').style.display = 'flex';
            history.pushState(null, '', 'chat.html');
            await loadConversationList();
        } else {
            showToast('Erreur, réessaie.');
        }
    });

    // ---------- ENVOI D'IMAGE ----------
    document.getElementById('attach-btn').addEventListener('click', () => {
        document.getElementById('media-input').click();
    });
    document.getElementById('media-input').addEventListener('change', async (e) => {
        const file = e.target.files[0];
        e.target.value = '';
        if (!file || !manager) return;
        const replyId = currentReplyTarget;
        currentReplyTarget = null;
        document.getElementById('reply-preview-bar').classList.remove('open');
        await manager.sendMedia(file, '', replyId);
    });

    let lastTypingSent = 0;
    document.getElementById('chat-input').addEventListener('input', () => {
        const now = Date.now();
        if (manager && now - lastTypingSent > 2000) {
            manager.notifyTyping();
            lastTypingSent = now;
        }
    });

    window.addEventListener('beforeunload', () => { if (manager) manager.stop(); });

    // ---------- CRÉATION DE GROUPE ----------
    document.getElementById('toggle-group-panel').addEventListener('click', () => {
        document.getElementById('group-panel').classList.toggle('open');
    });

    async function loadMembersForGroupPanel() {
        const { data: profiles } = await supabaseClient
            .from('profiles').select('id, prenom, classe').neq('id', currentUserId);
        const container = document.getElementById('group-members-list');
        container.innerHTML = '';
        (profiles || []).forEach(p => {
            const label = document.createElement('label');
            label.className = 'wa-member-checkbox';
            const checkbox = document.createElement('input');
            checkbox.type = 'checkbox';
            checkbox.value = p.id;
            const span = document.createElement('span');
            span.textContent = `${p.prenom || 'Élève'} — ${p.classe || 'Classe non renseignée'}`;
            label.appendChild(checkbox);
            label.appendChild(span);
            container.appendChild(label);
        });
    }

    document.getElementById('create-group-btn').addEventListener('click', async () => {
        const name = document.getElementById('group-name').value.trim();
        if (!name) { alert('Donne un nom au groupe.'); return; }
        const checked = Array.from(document.querySelectorAll('#group-members-list input:checked')).map(c => c.value);
        if (checked.length === 0) { alert('Sélectionne au moins un membre.'); return; }

        const convId = await createGroupConversation(name, checked, currentUserId);
        if (convId) {
            document.getElementById('group-panel').classList.remove('open');
            document.getElementById('group-name').value = '';
            await loadConversationList();
            await openConversation(convId);
        }
    });

    document.getElementById('signout-btn').addEventListener('click', async () => {
        await supabaseClient.auth.signOut();
        window.location.href = 'index.html';
    });
</script>
</body>
</html>
