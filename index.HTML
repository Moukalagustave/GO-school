<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go-school — Connexion</title>

    <!-- Balises Open Graph pour WhatsApp, Facebook, etc. -->
    <meta property="og:title" content="Go-school — La plateforme des élèves">
    <meta property="og:description" content="Rejoins Go-school pour booster ta scolarité, collaborer et échanger entre élèves.">
    <meta property="og:image" content="https://images.unsplash.com/photo-1523050854058-8df90110c9f1?w=1200">
    <meta property="og:type" content="website">

    <!-- CSS Unifié -->
    <link rel="stylesheet" href="style.css">

    <!-- SDK Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Conteneur de centrage (défini dans le nouveau style.css) -->
    <div class="auth-wrapper">
        
        <!-- Carte d'authentification -->
        <div class="auth-card" id="form-card">
            <h2 id="form-title">Connexion à Go-school</h2>

            <!-- Connexion Sociale -->
            <button type="button" class="social-btn" id="google-btn">
                <svg height="16" width="16" viewBox="0 0 24 24"><path fill="#EA4335" d="M12 5c1.6 0 3 .6 4.1 1.6l3.1-3.1C17.3 1.8 14.8 1 12 1 7.4 1 3.5 3.6 1.6 7.4l3.7 2.9C6.2 7.1 8.9 5 12 5z"/><path fill="#4285F4" d="M23.5 12.3c0-.8-.1-1.6-.2-2.3H12v4.5h6.5c-.3 1.5-1.1 2.8-2.4 3.7l3.7 2.9c2.2-2 3.7-5 3.7-8.8z"/><path fill="#FBBC05" d="M5.3 14.7c-.2-.7-.4-1.5-.4-2.7s.2-2 .4-2.7L1.6 6.4C.6 8.4 0 10.6 0 13s.6 4.6 1.6 6.6l3.7-2.9z"/><path fill="#34A853" d="M12 23c3.2 0 6-1.1 8-3l-3.7-2.9c-1.1.7-2.5 1.2-4.3 1.2-3.1 0-5.8-2.1-6.7-5.3L1.6 15.9C3.5 19.7 7.4 23 12 23z"/></svg>
                Continuer avec Google
            </button>

            <div class="divider"><span>OU</span></div>

            <!-- Formulaire Email/Password -->
            <div id="auth-container">
                <label for="email">Adresse email</label>
                <input type="email" id="email" placeholder="nom@exemple.com">
                
                <label for="password">Mot de passe</label>
                <input type="password" id="password" placeholder="••••••••">

                <button type="button" class="primary-btn" id="action-btn">Se connecter</button>
            </div>

            <div class="toggle-mode">
                <span id="toggle-text">Pas encore de compte ?</span> <a id="toggle-link">S'inscrire</a>
            </div>

            <p id="message"></p>
        </div>

    </div>

    <!-- Script d'authentification pur (sans gestion d'affichage de dashboard) -->
    <script>
        // Remplace par tes vraies clés Supabase
        const SUPABASE_URL = 'https://afwutxnapjrauouazcui.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_toczTCF8xRgxwebjftoXuA_QAO8MTKp';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let isSignUp = false;

        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('password');
        const msgEl = document.getElementById('message');
        const formTitle = document.getElementById('form-title');
        const actionBtn = document.getElementById('action-btn');
        const toggleText = document.getElementById('toggle-text');
        const toggleLink = document.getElementById('toggle-link');

        // Bascule dynamique Connexion / Inscription
        toggleLink.addEventListener('click', () => {
            isSignUp = !isSignUp;
            if (isSignUp) {
                formTitle.textContent = "Créer un compte Go-school";
                actionBtn.textContent = "S'inscrire";
                toggleText.textContent = "Déjà un compte ?";
                toggleLink.textContent = "Se connecter";
            } else {
                formTitle.textContent = "Connexion à Go-school";
                actionBtn.textContent = "Se connecter";
                toggleText.textContent = "Pas encore de compte ?";
                toggleLink.textContent = "S'inscrire";
            }
            msgEl.textContent = "";
        });

        // ==========================================
        // LA NOUVELLE LOGIQUE : REDIRECTION SIMPLE
        // ==========================================
        supabaseClient.auth.onAuthStateChange((event, session) => {
            if (session) {
                // Dès que l'utilisateur est connecté, on l'envoie sur l'application
                window.location.href = 'radar.html';
            }
        });

        // Action du bouton principal (Connexion ou Inscription)
        actionBtn.addEventListener('click', async () => {
            msgEl.textContent = '';
            const email = emailInput.value;
            const password = passwordInput.value;

            if (isSignUp) {
                const { error } = await supabaseClient.auth.signUp({ email, password });
                if (error) {
                    msgEl.textContent = error.message;
                } else {
                    alert('Inscription réussie ! Vérifie ton tableau de bord Supabase (ou tes emails).');
                }
            } else {
                const { error } = await supabaseClient.auth.signInWithPassword({ email, password });
                if (error) {
                    msgEl.textContent = error.message;
                }
            }
        });

        // Connexion Google OAuth
        document.getElementById('google-btn').addEventListener('click', async () => {
            const { error } = await supabaseClient.auth.signInWithOAuth({
                provider: 'google',
            });
            if (error) msgEl.textContent = error.message;
        });
    </script>
</body>
</html>
