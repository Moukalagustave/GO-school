<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Go-school — Chat</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="chat.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <div class="chat-app" id="chat-app">
        <header class="chat-header">
            <a href="chats.html" class="chat-header-back">←</a>
            <img id="chat-header-avatar" class="chat-header-avatar" src="" alt="">
            <div class="chat-header-info">
                <div id="chat-header-name" class="chat-header-name">Chargement…</div>
                <span id="connection-status">Déconnecté</span>
            </div>
        </header>

        <div id="chat-messages" class="chat-messages"></div>

        <form id="chat-form" class="chat-input-row">
            <input type="text" id="chat-input" maxlength="2000" placeholder="Écris un message…" autocomplete="off">
            <button type="submit" class="btn-accent">Envoyer</button>
        </form>
    </div>

    <div id="toast"></div>

    <script src="chat.js"></script>
    <script>
        const SUPABASE_URL = 'https://afwutxnapjrauouazcui.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_toczTCF8xRgxwebjftoXuA_QAO8MTKp';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let manager = null;

        function isValidAvatarUrlLocal(url) {
            return typeof url === 'string' && url.startsWith('https://api.dicebear.com/');
        }

        (async () => {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }

            const params = new URLSearchParams(window.location.search);
            const conversationId = params.get('c');
            if (!conversationId) {
                document.getElementById('chat-messages').textContent =
                    'Aucune conversation ouverte — ouvre un chat depuis Messages.';
                return;
            }

            const { data: conv, error: convErr } = await supabaseClient
                .from('conversations')
                .select('id, type, name, direct_user_a, direct_user_b')
                .eq('id', conversationId)
                .single();

            if (convErr || !conv) {
                document.getElementById('chat-header-name').textContent = 'Conversation introuvable';
                return;
            }

            const isGroup = conv.type === 'group';

            if (isGroup) {
                document.getElementById('chat-header-name').textContent = conv.name || 'Groupe';
                document.getElementById('chat-header-avatar').style.display = 'none';
            } else {
                const otherId = conv.direct_user_a === session.user.id ? conv.direct_user_b : conv.direct_user_a;
                const { data: profile } = await supabaseClient
                    .from('profiles').select('prenom, avatar_url').eq('id', otherId).maybeSingle();
                document.getElementById('chat-header-name').textContent = profile?.prenom || 'Élève';
                document.getElementById('chat-header-avatar').src = isValidAvatarUrlLocal(profile?.avatar_url)
                    ? profile.avatar_url
                    : `https://api.dicebear.com/9.x/bottts/svg?seed=${encodeURIComponent(otherId)}`;
            }

            manager = new ChatManager(conversationId, session.user.id, isGroup);
            window.addEventListener('beforeunload', () => manager.stop());
            await manager.start();
        })();

        document.getElementById('chat-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const input = document.getElementById('chat-input');
            if (manager && input.value.trim()) {
                manager.sendMessage(input.value);
                input.value = '';
            }
        });

        // ---------- CLAVIER MOBILE ----------
        // Sans ceci, le clavier virtuel recouvre le champ de saisie au lieu de
        // repousser la mise en page — problème réel sur les téléphones d'entrée
        // de gamme visés par le projet (identifié dès le Jour 1 de ce projet).
        if (window.visualViewport) {
            const appEl = document.getElementById('chat-app');
            const resize = () => {
                appEl.style.height = window.visualViewport.height + 'px';
                const messages = document.getElementById('chat-messages');
                messages.scrollTop = messages.scrollHeight;
            };
            window.visualViewport.addEventListener('resize', resize);
            resize();
        }
    </script>
</body>
</html>
